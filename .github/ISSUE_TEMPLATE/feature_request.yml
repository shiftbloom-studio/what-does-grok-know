name: Idea
description: Suggest a view, an analysis or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      description: Comment with your approach and wait to be assigned before you start, see CONTRIBUTING.md.
      options:
        - label: I'd like to work on this myself
