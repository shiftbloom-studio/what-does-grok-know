name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Load an export with about 500 conversations\n2. Open Insights\n3. …"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Never paste parts of your export. Error messages from the browser console are enough.
      render: text
